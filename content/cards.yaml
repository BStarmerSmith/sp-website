# Card deck content
# ─────────────────────────────────────────────────────────────────────
# Each card entry defines one playing card in the deck.
#
# Fields:
#   id        Unique identifier — for reference only, not shown in UI
#   position  Display order — lower shows first, independent of the image
#             filename. Gaps are fine (only relative order matters).
#             Optional — cards without one go last, in the order listed here.
#   hidden    Optional. true leaves the card out of the deck entirely.
#   link      Optional URL. Clicking the bottom half of the card front opens it.
#   alt       Optional. The card's text, for screen readers and search engines
#             (the card art is an image). Falls back to the name.
#   image     Filename (without extension) from /assets/cards/ — e.g. 1 → 1.png
#
# Back images are cycled automatically from the backs list below.
# ─────────────────────────────────────────────────────────────────────

backs:
  - back_1.png
  - back_2.png
  - back_3.png
  - back_4.png
  - back_5.png

cards:
  - id: welcome
    name: Welcome Page
    alt: "Hello! We are Philip, Theo and Ben. Together we create delightful, confusing and highly unique games that make the player feel clever."
    image: 1
    position: 1

  - id: middle-bit
    name: The Middle Bit
    alt: "The Middle Bit: a new Venn Diagram puzzle every day. Can you spot what the seemingly unconnected have in common? Click to play."
    image: 4
    position: 2
    link: https://the-middle-bit.co.uk/

  - id: wangle
    name: Wangle
    alt: "Wangle: a bit like a crossword and a maths problem had a baby, and then the baby fell in love with pop culture. In the pitching stage."
    image: 3
    position: 3

  - id: contact-us
    name: Contact Us
    alt: "See anything that interests you? Drop us an email and say hi: hello@suzyparkergames.co.uk"
    position: 4
    image: 6

  - id: why-axis
    name: The Why Axis
    image: 2
    hidden: true

  - id: dynamite-squad
    name: Dynamite Squad
    image: 5
    hidden: true

  
