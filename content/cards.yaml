# Card deck content
# ─────────────────────────────────────────────────────────────────────
# Each card entry defines one playing card in the deck.
#
# Fields:
#   id        Unique identifier — for reference only, not shown in UI
#   position  Display order, starting at 1
#   image     Filename (without extension) from /assets/cards/ — e.g. 1 → 1.png
#
# Back images are cycled automatically from the backs list below.
# ─────────────────────────────────────────────────────────────────────

backs:
  - back_1.png
  - back_2.png
  - back_3.png
  - back_4.png
  - back_5.png

cards:
  - id: welcome
    name: Welcome Page
    position: 1
    image: 1

  - id: why-axis
    name: The Why Axis
    position: 2
    image: 2

  - id: wangle
    name: Wangle
    position: 3
    image: 3

  - id: middle-bit
    name: The Middle Bit
    position: 4
    image: 4

  - id: dynamite-squad
    name: Dynamite Squad
    position: 5
    image: 5

  - id: contact-us
    name: Contact Us
    position: 6
    image: 6
