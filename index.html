<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suzy Parker Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Preload all card images for seamless navigation -->
  <link rel="preload" as="image" href="/assets/cards/1.png">
  <link rel="preload" as="image" href="/assets/cards/2.png">
  <link rel="preload" as="image" href="/assets/cards/3.png">
  <link rel="preload" as="image" href="/assets/cards/4.png">
  <link rel="preload" as="image" href="/assets/cards/5.png">
  <link rel="preload" as="image" href="/assets/cards/6.png">
  <link rel="preload" as="image" href="/assets/cards/back_1.png">
  <link rel="preload" as="image" href="/assets/cards/back_2.png">
  <link rel="preload" as="image" href="/assets/cards/back_3.png">
  <link rel="preload" as="image" href="/assets/cards/back_4.png">
  <link rel="preload" as="image" href="/assets/cards/back_5.png">
  
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="home-layout">

  <div id="auroraContainer" aria-hidden="true"></div>

  <a href="/" class="home-logo" aria-label="Suzy Parker Games home">
    <img src="/assets/sp-logo-header.png" alt="Suzy Parker Games" />
  </a>

  <div class="card-stage" id="cardStage">
    <div class="card-tilt-stage" id="cardTiltStage">
      <div class="card-wrapper" id="cardWrapper">
        <div class="playing-card card-front">
          <img class="card-image" id="cardFrontImage" src="/assets/cards/1.png" alt="Card front" />
        </div>
        <div class="playing-card card-back">
          <img class="card-image" id="cardBackImage" src="/assets/cards/back_1.png" alt="Card back" />
        </div>
      </div>
    </div>
  </div>

  <div class="card-nav-dots" id="cardNavDots" aria-label="Card navigation"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
